<table class="wikitable"><tr><th colspan="2">草</th></tr><tr><td><strong>词性</strong></td><td>名词、叹词、形容词、形容动词</td></tr><tr><td><strong>释义</strong></td><td>指代男性的性交动作，多用于<a href="../pages/辱骂-5c727a5b68.html">辱骂</a>中<br>指一种植物</td></tr><tr><td><strong>例句</strong></td><td>草你妈的</td></tr><tr><td><strong>拼音</strong></td><td>cǎo</td></tr><tr><td><strong>注音</strong></td><td>ㄘㄠˇ</td></tr></table>
<p>在<a href="https://zh.wikipedia.org/zh-tw/汉语" target="_blank" rel="noopener noreferrer">中国语</a>中，<strong>草</strong>字通常是指代<strong>肏</strong>一字。在语言学中，这是字义的消解，使其原本之释义淡化，并逐渐赋予新的意义。</p>
<h2 id="section-消解">消解</h2>
<p>本字元被用作<a href="../pages/辱骂-5c727a5b68.html">辱骂</a>时，辱骂强度通常不高。一般地，我们将本字元用于感叹当中，故<strong>草</strong>可单独用作叹词。</p></div></article></main><script src="../app.js"></script></body></html>
