      <p>
       在
       <a href="https://zh.wikipedia.org/zh-tw/%E6%B1%89%E8%AF%AD" rel="noopener noreferrer" target="_blank">
        中国语
       </a>
       中，
       <b>
        草
       </b>
       字通常是指代
       <b>
        肏
       </b>
       一字。
       <mark title="需要提供文献来源">
        在语言学中，这是字义的消解，使其原本之释义淡化，并逐渐赋予新的意义。
       </mark>
      </p>
      <h2>
       <span>
       </span>
       <span>
        消解
       </span>
      </h2>
      <p>
       本字元被用作
       <a href="../pages/辱骂-996d6dd9f8.html" title="辱骂">
        辱骂
       </a>
       时，辱骂强度通常不高。一般地，我们将本字元用于感叹当中，故
       <b>
        草
       </b>
       可单独用作叹词。
      </p>
