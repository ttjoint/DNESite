<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恶俗 · 中国人Wiki</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><a class="brand" href="../index.html">中国人Wiki</a><a class="back" href="../index.html">返回目录</a><a class="edit-link" href="../admin.html?slug=恶俗-100dc198ac.html">编辑</a></header><main class="page-wrap"><article class="article"><h1>恶俗</h1><div class="entry-info"><span>录入：2026-09-26</span><span>#概念</span></div><div class="article-body"><p><a class="media-link" href="../media/10937141ebf9.html"><img loading="lazy" src="../assets/esu/images/thumb/7/7b/PhraseologyBoxLogo.jpg/50px-PhraseologyBoxLogo.jpg" alt="PhraseologyBoxLogo.jpg"></a> <strong>用语解释</strong> 本页是一个<a href="../pages/concept-913168b072.html">专有名词</a>的恶俗概念解释页面。 所谓恶俗，是指某种虚假、粗陋、毫无智慧、没有才气、空洞而令人厌恶的东西，但是，有很多人竟会相信它们是纯正、高雅、明智或迷人的。 恶俗 <span class="attachment">图片：Wuha.jpg</span><br>wuha <strong>释义</strong> <strong>场合</strong> <strong>评分</strong> ★ 真正恶俗的事物必然会显示出刻意虚饰、矫揉造作或欺骗性。不新鲜的食物是糟糕的，若餐馆刻意奉上不新鲜的食物，还要赋以“美食”之名，那就是恶俗了。 以上定义摘自百度百科。 恶俗维基的作用显而易见。</p></div></article></main><script src="../app.js"></script></body></html>
