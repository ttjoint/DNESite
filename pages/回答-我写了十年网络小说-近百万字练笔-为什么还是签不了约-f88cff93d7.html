<main class="page-wrap"><article class="article"><div class="eyebrow">esu-main</div><h1>《回答：我写了十年网络小说，近百万字练笔，为什么还是签不了约？》</h1><div class="article-body"><div class="mw-parser-output"><h2><span></span><span>作者</span></h2> <p><a href="../pages/刘泽-d02d79f339.html" title="刘泽">刘泽</a> </p> <h2><span></span><span>削除前地址</span></h2> <p><a href="#" rel="nofollow">https://www.zhihu.com/question/317878533/answer/636499953</a> </p> <h2><span></span><span>正文</span></h2> <p>签约容易，不断更难。 </p><p>等你签约之后你才会发现，这只是个开始。一般连签约都成问题的作家，根本不适合这一行。 </p><p>当然，也有极个别例外。 </p><p>最主要的是，十年百万字？你如果一年百万字，还不能签约的话，那我就把我的手机吃了。 </p><p>勤奋，永远是网络小说最重要的一点。 </p> </div></div></article></main>
