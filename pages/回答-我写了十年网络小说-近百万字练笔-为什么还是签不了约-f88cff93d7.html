<h2 id="section-正文">正文</h2>
<p>签约容易，不断更难。</p>
<p>等你签约之后你才会发现，这只是个开始。一般连签约都成问题的作家，根本不适合这一行。</p>
<p>当然，也有极个别例外。</p>
<p>最主要的是，十年百万字？你如果一年百万字，还不能签约的话，那我就把我的手机吃了。</p>
<p>勤奋，永远是网络小说最重要的一点。</p></div></article></main><script src="../app.js"></script></body></html>
