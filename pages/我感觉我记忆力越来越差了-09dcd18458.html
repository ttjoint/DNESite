      <p>
       我感觉我记忆力越来越差了&hellip;&hellip;
      </p>
      <p>
       有的时候打电话，挂断电话就忘了电话里说的什么。
      </p>
      <p>
       晚上经常回忆不起早上的事情，刚说完的事情转头就忘。
      </p>
      <p>
       很多事情过去一两天就记忆模糊了，一个月以上的事情如果没人提肯定想不起。
      </p>
      <p>
       一年以前的工作内容，经常是别人跟我再描述一遍我才能逐渐回忆起来，而且还会丢失细节。 &ZeroWidthSpace;&ZeroWidthSpace;&ZeroWidthSpace;&ZeroWidthSpace;
      </p>
