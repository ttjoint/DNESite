<main class="page-wrap"><article class="article"><div class="eyebrow">esu-main</div><h1>《回答：有哪些让你觉得恶心的恶俗歌词？》</h1><div class="article-body"><div class="mw-parser-output"><h2><span></span><span>作者</span></h2> <p><a href="../pages/刘泽-d02d79f339.html" title="刘泽">刘泽</a> </p> <h2><span></span><span>削除前地址</span></h2> <p><a href="#" rel="nofollow">https://www.zhihu.com/question/55147202/answer/603629818</a> </p> <h2><span></span><span>正文</span></h2> <p>强答一波！ </p><p>恶俗歌词倒是没怎么听说，毕竟能传唱出来的肯定有其中的缘由在里面。 </p><p>虽然说我没听过有什么恶俗歌词，但是我听说过恶俗啊。 </p><p>在b站，在知乎，微博，贴吧，全国各大中小学学校，都或多或少有恶俗狗的存在。 </p><p>我觉得恶俗这群人要比恶俗歌词恶心多了啊…… </p><p><a><img alt="恶俗歌词1.jpg" height="867" loading="lazy" src="./../I/esu.wiki/images/thumb/f/ff/%E6%81%B6%E4%BF%97%E6%AD%8C%E8%AF%8D1.jpg/400px-%E6%81%B6%E4%BF%97%E6%AD%8C%E8%AF%8D1.jpg" width="400"/></a> <a><img alt="恶俗歌词2.jpg" height="867" loading="lazy" src="./../I/esu.wiki/images/thumb/5/53/%E6%81%B6%E4%BF%97%E6%AD%8C%E8%AF%8D2.jpg/400px-%E6%81%B6%E4%BF%97%E6%AD%8C%E8%AF%8D2.jpg" width="400"/></a> </p><p>没打码的就是恶俗。 </p> </div></div></article></main>
