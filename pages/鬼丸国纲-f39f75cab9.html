<h2 id="section-使用例">使用例</h2>
<p>1941年，裕仁天皇将此刀赠送给炮兵少佐邱野一郎，勉励他为日本皇室尽忠。据传邱野一郎在冲绳岛切腹后，成为美军战利品，交还给日方。 和炮兵少佐同名的日本爱知县游客邱野一郎曾经挥舞此刀在八达岭长城、虎门炮台上拍照留念。</p></div></article></main><script src="../app.js"></script></body></html>
