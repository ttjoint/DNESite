<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赵旭升东方灵堂 · 中国人Wiki</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><a class="brand" href="../index.html">中国人Wiki</a><a class="back" href="../index.html">返回目录</a><a class="edit-link" href="../admin.html?slug=赵旭升东方灵堂-99c27ac754.html">编辑</a></header><main class="page-wrap"><article class="article"><h1>赵旭升东方灵堂</h1><div class="entry-info"><span>录入：2026-09-26</span><span>#文章</span></div><div class="article-body"><p>由于赵旭升最近频繁钦点退圈的人，认为已经在东方圈死去的、无法发声、不愿惹事的人物可以成为他不碰恶俗的借口，频繁隔空喊话展开冥界神交。那我们只能很遗憾的认为，我们尊敬的领袖、伟大的舵手赵旭升同志由于日啖饲料4000克暴饮暴食，肥宅作息熬夜到四点，导致内分泌紊乱，心脏衰竭等，于1993年6月17日永远的离开了我们。我希望各位东方众为这个东方的伟人、东方的皇帝、东方的统帅默哀一个普朗克时间，并要坚强、乐观的笑着送他驾鹤西游。 <span class="attachment">图片：800px-Zxs灵堂.jpg</span></p></div></article></main><script src="../app.js"></script></body></html>
